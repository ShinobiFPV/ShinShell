<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShinShell is offline</title>
    <style>
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #0b0d10;
        color: #e8e8e8;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      .offline-card {
        text-align: center;
        padding: 24px;
      }
      .offline-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ff3c3c;
        display: inline-block;
        margin-right: 8px;
      }
      h1 {
        font-size: 16px;
        font-weight: 600;
      }
      p {
        color: #888;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="offline-card">
      <h1><span class="offline-dot"></span>ShinShell is offline</h1>
      <p>Can't reach your ShinShell over Tailscale right now.<br />Check that ShinShell is running and this device is on the tailnet.</p>
    </div>
  </body>
</html>
