name: Release

# Tag-driven only — see docs/DEPLOYING.md "Releasing". Never hand-upload
# installers; pushing a v* tag is the one and only path to a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # electron-builder needs this to create the release + upload assets

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20's bundled npm ships a node-gyp too old to find VS2022 on
          # the windows-latest runner ("Could not find any Visual Studio
          # installation" rebuilding node-pty) — 22 carries a node-gyp that
          # detects it fine. Matches what's proven working on the dev
          # machine (Node 24, same fix, one major newer).
          node-version: 22

      - run: npm ci

      - run: npm run release:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
